org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# AGP 9 enables built-in Kotlin/new DSL by default. Keep the explicit Kotlin 2.4.20
# toolchain for this first app baseline; migrate to built-in Kotlin after the first
# verified device build to avoid mixing compiler toolchains during bring-up.
android.builtInKotlin=false
android.newDsl=false
