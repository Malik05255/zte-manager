name: One-shot visual home V6

on:
  push:
    branches:
      - feature/connect-performance-credentials-0.5.7
    paths:
      - app/src/main/java/com/malik/ztesmartmanager/HaiVisualHomeDashboardV6.kt

permissions:
  contents: write

jobs:
  switch-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/connect-performance-credentials-0.5.7
          fetch-depth: 0
      - name: Switch production home to visual implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/malik/ztesmartmanager/HaiHomeDashboardV5.kt')
          text = p.read_text()
          old = 'fun HaiHomeDashboardV5(\n'
          new = 'fun HaiHomeDashboardV5Legacy(\n'
          if old in text:
              text = text.replace(old, new, 1)
              p.write_text(text)
          PY
          rm -f .github/workflows/one-shot-visual-home-v6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Switch home to visual V6 dashboard"
          git push origin HEAD:feature/connect-performance-credentials-0.5.7
