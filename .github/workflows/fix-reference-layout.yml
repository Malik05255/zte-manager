name: Fix reference layout

on:
  workflow_dispatch:
  push:
    branches: [feature/connect-performance-credentials-0.5.7]
    paths: [.github/workflows/fix-reference-layout.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/connect-performance-credentials-0.5.7
      - name: Fix direction and viewport
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('app/src/main/java/com/malik/ztesmartmanager/ReferenceHomeDashboard.kt'); s=p.read_text(); s=s.replace('val uiScale = min(scaleX, scaleY)', 'val uiScale = scaleX'); s=s.replace('.align(Alignment.Center)\\n                .scale(uiScale)', '.align(Alignment.TopCenter)\\n                .scale(uiScale)'); p.write_text(s)"
          python3 -c "from pathlib import Path; p=Path('app/src/main/java/com/malik/ztesmartmanager/ArabicHaiDashboardV3.kt'); s=p.read_text(); old='''            if (snapshot != null && section == M3Section.HOME) {\n                ReferenceHomeDashboard('''; new='''            if (snapshot != null && section == M3Section.HOME) {\n                CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {\n                    ReferenceHomeDashboard('''; s=s.replace(old,new,1); marker='''                    onOptimizeNow = onOptimizeNow\n                )\n                return@BoxWithConstraints'''; replacement='''                    onOptimizeNow = onOptimizeNow\n                    )\n                }\n                return@BoxWithConstraints'''; s=s.replace(marker,replacement,1); p.write_text(s)"
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/malik/ztesmartmanager/ReferenceHomeDashboard.kt app/src/main/java/com/malik/ztesmartmanager/ArabicHaiDashboardV3.kt
          git commit -m "Match reference home layout direction and top alignment"
          git push origin HEAD:feature/connect-performance-credentials-0.5.7
