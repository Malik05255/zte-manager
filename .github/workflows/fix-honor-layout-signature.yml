name: Fix Honor layout signature

on:
  push:
    branches:
      - feature/connect-performance-credentials-0.5.7
    paths:
      - .github/workflows/fix-honor-layout-signature.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/connect-performance-credentials-0.5.7
      - name: Fix tall layout parameter placement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/malik/ztesmartmanager/ReferenceHomeDashboard.kt')
          s = p.read_text()
          public_marker = 'fun ReferenceHomeDashboard('
          content_marker = 'private fun ReferenceDashboardContent('
          a = s.index(public_marker)
          b = s.index(content_marker)
          public = s[a:b]
          public = public.replace('    smartBusy: Boolean,\n    tallLayout: Boolean,\n    onDisconnect:', '    smartBusy: Boolean,\n    onDisconnect:', 1)
          rest = s[b:]
          rest = rest.replace('    smartBusy: Boolean,\n    onDisconnect:', '    smartBusy: Boolean,\n    tallLayout: Boolean,\n    onDisconnect:', 1)
          p.write_text(s[:a] + public + rest)
          PY
      - name: Commit source and remove one-shot workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/malik/ztesmartmanager/ReferenceHomeDashboard.kt
          git rm .github/workflows/fix-honor-layout-signature.yml
          git commit -m "Fix Honor 200 dashboard tall-layout parameter"
          git push origin HEAD:feature/connect-performance-credentials-0.5.7
