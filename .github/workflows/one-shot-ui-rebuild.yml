name: One-shot UI rebuild

on:
  push:
    branches:
      - feature/connect-performance-credentials-0.5.7

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/connect-performance-credentials-0.5.7
          fetch-depth: 0

      - name: Apply project-wide UI rebuild
        shell: bash
        run: |
          cat > /tmp/ui_patch.py <<'PY'
          from pathlib import Path

          def patch(path, pairs):
              p = Path(path)
              s = p.read_text()
              for old, new in pairs:
                  if old not in s:
                      raise SystemExit(f'missing token in {path}: {old[:100]!r}')
                  s = s.replace(old, new, 1)
              p.write_text(s)

          patch('app/src/main/java/com/malik/ztesmartmanager/ArabicHaiDashboardV3.kt', [
              ('''                Box(Modifier.weight(1f)) {
                              LazyColumn(
                                  modifier = Modifier.fillMaxSize(),''', '''                LazyColumn(
                              modifier = Modifier.weight(1f).fillMaxWidth(),'''),
              ('bottom = (layout.bottomBarHeight + layout.gap).dp', 'bottom = (layout.gap * 2).dp'),
              ('''                    }
                              M3BottomNav(section, { section = it }, Modifier.align(Alignment.BottomCenter))
                          }''', '''                }
                          M3BottomNav(section) { section = it }'''),
              ('Text("السجلات الحية", color = M3Ink, fontSize = m3sp(layout, 20)', 'Text("السجلات الحية", color = M3Ink, fontSize = m3sp(layout, 24)'),
              ('Text("آخر القراءات التي استلمها التطبيق فعلًا من الراوتر", color = M3Muted, fontSize = m3sp(layout, 11))', 'Text("آخر القراءات التي استلمها التطبيق فعلًا من الراوتر", color = M3Muted, fontSize = m3sp(layout, 13), lineHeight = m3sp(layout, 18))'),
          ])

          patch('app/src/main/java/com/malik/ztesmartmanager/core/presentation/HaiResponsivePolicy.kt', [
              ('val textScale = widthScale.coerceIn(1.00f, 1.08f)', 'val textScale = (widthScale * 1.08f).coerceIn(1.08f, 1.16f)'),
              ('HaiSizeClass.COMPACT -> 10\n            HaiSizeClass.STANDARD -> 12\n            HaiSizeClass.LARGE -> 18', 'HaiSizeClass.COMPACT -> 12\n            HaiSizeClass.STANDARD -> 14\n            HaiSizeClass.LARGE -> 20'),
              ('HaiSizeClass.COMPACT -> 5\n            HaiSizeClass.STANDARD -> 6\n            HaiSizeClass.LARGE -> 10', 'HaiSizeClass.COMPACT -> 7\n            HaiSizeClass.STANDARD -> 8\n            HaiSizeClass.LARGE -> 12'),
              ('HaiSizeClass.COMPACT -> 16\n                HaiSizeClass.STANDARD -> 18\n                HaiSizeClass.LARGE -> 20', 'HaiSizeClass.COMPACT -> 18\n                HaiSizeClass.STANDARD -> 20\n                HaiSizeClass.LARGE -> 22'),
              ('sizeClass == HaiSizeClass.COMPACT -> 148\n                else -> 156', 'sizeClass == HaiSizeClass.COMPACT -> 160\n                else -> 172'),
              ('sizeClass == HaiSizeClass.COMPACT -> 126\n                else -> 132', 'sizeClass == HaiSizeClass.COMPACT -> 140\n                else -> 150'),
              ('HaiSizeClass.LARGE -> 260\n                else -> 235', 'HaiSizeClass.LARGE -> 290\n                else -> 260'),
              ('HaiSizeClass.LARGE -> 190\n                else -> 170', 'HaiSizeClass.LARGE -> 205\n                else -> 184'),
              ('HaiSizeClass.LARGE -> 74\n                else -> 70', 'HaiSizeClass.LARGE -> 82\n                else -> 78'),
          ])

          patch('app/src/main/java/com/malik/ztesmartmanager/HaiUiSizing.kt', [
              ('pagePadding = 12.dp', 'pagePadding = 14.dp'), ('sectionGap = 6.dp', 'sectionGap = 8.dp'),
              ('cardRadius = 18.dp', 'cardRadius = 20.dp'), ('smallRadius = 13.dp', 'smallRadius = 14.dp'),
              ('headerHeight = 66.dp', 'headerHeight = 72.dp'), ('bottomNavHeight = 70.dp', 'bottomNavHeight = 78.dp'),
              ('chromeButtonSize = 32.dp', 'chromeButtonSize = 36.dp'), ('minimumTouchTarget = 44.dp', 'minimumTouchTarget = 48.dp'),
              ('mapHeight = 235.dp', 'mapHeight = 260.dp'),
              ('fontScale.coerceIn(1.00f, 1.08f)', 'fontScale.coerceIn(1.00f, 1.15f)'),
          ])

          patch('app/src/main/java/com/malik/ztesmartmanager/HaiSharedChrome.kt', [
              ('fontSize = 20.5.sp', 'fontSize = 22.sp'), ('lineHeight = 21.sp', 'lineHeight = 23.sp'),
              ('fontSize = 8.2.sp', 'fontSize = 10.sp'), ('lineHeight = 9.sp', 'lineHeight = 12.sp'),
              ('.height(33.dp)', '.height(36.dp)'), ('fontSize = 9.2.sp', 'fontSize = 10.5.sp'),
              ('Modifier.size(23.dp)', 'Modifier.size(25.dp)'), ('Modifier.size(17.dp)', 'Modifier.size(19.dp)'),
              ('Modifier.size(21.dp)', 'Modifier.size(24.dp)'), ('fontSize = 7.7.sp', 'fontSize = 9.2.sp'),
          ])

          patch('app/src/main/java/com/malik/ztesmartmanager/HaiReferenceDesign.kt', [
              ('HeroHeight: Dp = 160.dp', 'HeroHeight: Dp = 184.dp'), ('MetricHeight: Dp = 58.dp', 'MetricHeight: Dp = 70.dp'),
              ('MiddleRowHeight: Dp = 136.dp', 'MiddleRowHeight: Dp = 176.dp'), ('TowerRowHeight: Dp = 118.dp', 'TowerRowHeight: Dp = 146.dp'),
              ('BottomRowHeight: Dp = 94.dp', 'BottomRowHeight: Dp = 122.dp'),
          ])

          patch('app/src/main/java/com/malik/ztesmartmanager/HaiHomeDashboardV4.kt', [
              ('height(176.dp)', 'height(H4.HeroHeight)'), ('height(64.dp)', 'height(H4.MetricHeight)'),
              ('height(160.dp)', 'height(H4.MiddleRowHeight)'), ('height(134.dp)', 'height(H4.TowerRowHeight)'),
              ('height(112.dp)', 'height(H4.BottomRowHeight)'),
          ])

          for path in [
              'app/src/test/java/com/malik/ztesmartmanager/MobileUiV2ReadabilityTest.kt',
              'app/src/test/java/com/malik/ztesmartmanager/core/presentation/HaiResponsivePolicyTest.kt',
          ]:
              p = Path(path)
              s = p.read_text()
              repl = {
                  'widthScale.coerceIn(1.00f, 1.08f)': '(widthScale * 1.08f).coerceIn(1.08f, 1.16f)',
                  'height(176.dp)': 'height(H4.HeroHeight)', 'height(64.dp)': 'height(H4.MetricHeight)',
                  'height(160.dp)': 'height(H4.MiddleRowHeight)', 'height(134.dp)': 'height(H4.TowerRowHeight)', 'height(112.dp)': 'height(H4.BottomRowHeight)',
                  'assertEquals(10, spec.horizontalPaddingDp)': 'assertEquals(12, spec.horizontalPaddingDp)',
                  'assertEquals(5, spec.sectionGapDp)': 'assertEquals(7, spec.sectionGapDp)',
                  'assertEquals(16, spec.cardRadiusDp)': 'assertEquals(18, spec.cardRadiusDp)',
                  'assertEquals(148, spec.networkCardHeightDp)': 'assertEquals(160, spec.networkCardHeightDp)',
                  'assertEquals(126, spec.speedCardHeightDp)': 'assertEquals(140, spec.speedCardHeightDp)',
                  'assertEquals(70, spec.bottomBarHeightDp)': 'assertEquals(78, spec.bottomBarHeightDp)',
                  'assertEquals(12, spec.horizontalPaddingDp)': 'assertEquals(14, spec.horizontalPaddingDp)',
                  'assertEquals(6, spec.sectionGapDp)': 'assertEquals(8, spec.sectionGapDp)',
                  'assertEquals(18, spec.cardRadiusDp)': 'assertEquals(20, spec.cardRadiusDp)',
                  'assertEquals(156, spec.networkCardHeightDp)': 'assertEquals(172, spec.networkCardHeightDp)',
                  'assertEquals(132, spec.speedCardHeightDp)': 'assertEquals(150, spec.speedCardHeightDp)',
                  'assertTrue(spec.textScale in 1.00f..1.01f)': 'assertTrue(spec.textScale in 1.08f..1.09f)',
                  'assertEquals(1.08f, spec.textScale, 0.0001f)': 'assertEquals(1.16f, spec.textScale, 0.0001f)',
                  'assertTrue(spec.textScale in 1.04f..1.06f)': 'assertTrue(spec.textScale in 1.12f..1.14f)',
                  'assertTrue(spec.textScale <= 1.08f)': 'assertTrue(spec.textScale <= 1.16f)',
              }
              for old, new in repl.items():
                  s = s.replace(old, new)
              p.write_text(s)
          PY
          python3 /tmp/ui_patch.py

      - name: Validate and commit
        shell: bash
        run: |
          grep -q 'modifier = Modifier.weight(1f).fillMaxWidth()' app/src/main/java/com/malik/ztesmartmanager/ArabicHaiDashboardV3.kt
          ! grep -q 'M3BottomNav(section, { section = it }, Modifier.align(Alignment.BottomCenter))' app/src/main/java/com/malik/ztesmartmanager/ArabicHaiDashboardV3.kt
          grep -q 'HeroHeight: Dp = 184.dp' app/src/main/java/com/malik/ztesmartmanager/HaiReferenceDesign.kt
          rm -f .github/workflows/one-shot-ui-rebuild.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ui: rebuild all screens for larger readable layout and safe scroll'
          git push origin HEAD:feature/connect-performance-credentials-0.5.7
