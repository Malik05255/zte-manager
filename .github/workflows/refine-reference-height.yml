name: Refine reference viewport

on:
  workflow_dispatch:
  push:
    branches:
      - feature/connect-performance-credentials-0.5.7
    paths:
      - .github/workflows/refine-reference-height.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/connect-performance-credentials-0.5.7
      - name: Patch logical height
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('app/src/main/java/com/malik/ztesmartmanager/ReferenceHomeDashboard.kt'); s=p.read_text(); old='        val designWidth = 393.dp\\n        val designHeight = 699.dp\\n        val scaleX = maxWidth.value / designWidth.value\\n        val scaleY = maxHeight.value / designHeight.value\\n        val uiScale = scaleX'; new='        val designWidth = 393.dp\\n        val scaleX = maxWidth.value / designWidth.value\\n        val uiScale = scaleX\\n        val designHeight = (maxHeight.value / uiScale).dp'; assert old in s; p.write_text(s.replace(old,new,1))"
      - name: Commit source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/malik/ztesmartmanager/ReferenceHomeDashboard.kt
          git commit -m "Use full tall-phone viewport for reference dashboard"
          git push origin HEAD:feature/connect-performance-credentials-0.5.7
