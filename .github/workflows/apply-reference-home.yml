name: Apply reference home dashboard

on:
  push:
    branches:
      - feature/connect-performance-credentials-0.5.7

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/connect-performance-credentials-0.5.7
          fetch-depth: 0

      - name: Install reference home screen
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64, gzip
          payload = ""
          home = Path("app/src/main/java/com/malik/ztesmartmanager/ReferenceHomeDashboard.kt")
          home.write_bytes(gzip.decompress(base64.b64decode(payload)))

          dashboard = Path("app/src/main/java/com/malik/ztesmartmanager/ArabicHaiDashboardV3.kt")
          text = dashboard.read_text(encoding="utf-8")
          marker = "            Column(Modifier.fillMaxSize()) {"
          replacement = '            if (snapshot != null && section == M3Section.HOME) {\n                ReferenceHomeDashboard(\n                    snapshot = snapshot,\n                    telemetrySamples = telemetrySamples,\n                    status = status,\n                    operationMessage = operationMessage,\n                    lastPerformance = lastPerformance,\n                    speedBusy = speedBusy,\n                    controlBusy = controlBusy,\n                    smartBusy = smartBusy,\n                    onDisconnect = onDisconnect,\n                    onSpeedTest = onSpeedTest,\n                    onSetNetworkMode = onSetNetworkMode,\n                    onNavigateNetwork = { section = M3Section.NETWORK },\n                    onNavigateTowers = { section = M3Section.TOWERS },\n                    onNavigateBands = { section = M3Section.BANDS },\n                    onNavigateTools = { section = M3Section.TOOLS },\n                    onOptimizeNow = onOptimizeNow\n                )\n                return@BoxWithConstraints\n            }\n\n            Column(Modifier.fillMaxSize()) {'
          if "ReferenceHomeDashboard(" not in text:
              if marker not in text:
                  raise SystemExit("ArabicHaiDashboardV3 insertion marker not found")
              text = text.replace(marker, replacement, 1)
              dashboard.write_text(text, encoding="utf-8")
          PYCODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/malik/ztesmartmanager/ReferenceHomeDashboard.kt app/src/main/java/com/malik/ztesmartmanager/ArabicHaiDashboardV3.kt
          git rm .github/workflows/apply-reference-home.yml
          git commit -m "Replace home dashboard with reference design"
          git push origin HEAD:feature/connect-performance-credentials-0.5.7
