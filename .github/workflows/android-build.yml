              val longitude: Double,
              val accuracyMeters: Double?
          )

          private data class TowerLocatedMarker(
              val candidate: TowerLookupCandidate,
              val point: TowerGeoPoint
          )

          private data class TowerLookupKey(
              val mcc: Int,
              val mnc: Int,
              val areaCode: Int,
              val cellId: Long
          )

          @Composable
          fun VerifiedTowerMapPanel(
              snapshot: RouterSnapshot,
              cells: List<NearbyCell>,
              busy: Boolean,
              onLockCell: (NearbyCell) -> Unit
          ) {
              val context = LocalContext.current
              var locationAllowed by remember { mutableStateOf(hasLocationPermission(context)) }
              var deviceLocation by remember { mutableStateOf(bestLastKnownLocation(context)) }
              var located by remember { mutableStateOf<List<TowerLocatedMarker>>(emptyList()) }
              var resolving by remember { mutableStateOf(false) }

              val permissionLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { result ->
                  locationAllowed = result[Manifest.permission.ACCESS_FINE_LOCATION] == true ||
                      result[Manifest.permission.ACCESS_COARSE_LOCATION] == true
                  if (locationAllowed) deviceLocation = bestLastKnownLocation(context)
              }

              DisposableEffect(locationAllowed) {
                  if (!locationAllowed) {
                      onDispose { }
                  } else {
                      val manager = context.getSystemService(Context.LOCATION_SERVICE) as LocationManager
                      val listener = object : LocationListener {
                          override fun onLocationChanged(location: Location) {
                              deviceLocation = location
                          }
                      }
                      startLocationUpdates(manager, listener)
                      bestLastKnownLocation(context)?.let { deviceLocation = it }
                      onDispose { runCatching { manager.removeUpdates(listener) } }
                  }
              }

              val candidates = remember(snapshot.raw, snapshot.cells, cells) {
                  buildTowerCandidates(snapshot, cells)
              }

              LaunchedEffect(candidates) {
                  if (candidates.isEmpty()) {
                      located = emptyList()
                      resolving = false
                  } else {
                      resolving = true
                      located = withContext(Dispatchers.IO) {
                          candidates.take(MAX_GEO_LOOKUPS).mapNotNull { candidate ->
                              OpenTowerGeoResolver.locate(candidate)?.let { point ->
                                  TowerLocatedMarker(candidate, point)
                              }
                          }
                      }
                      resolving = false
                  }
              }

              Column(
                  Modifier.fillMaxWidth().clip(RoundedCornerShape(20.dp)).background(TowerMapSoft).padding(12.dp)
              ) {
                  Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                      Column(Modifier.weight(1f)) {
                          Text("الخريطة الحقيقية", color = TowerMapInk, fontSize = 15.sp, fontWeight = FontWeight.Black)
                          Text(
                              when {
                                  resolving -> "جاري مطابقة معرفات الخلايا مع قاعدة المواقع…"
                                  located.isNotEmpty() -> "${located.size} موقع خلية له إحداثيات من مصدر بيانات"
                                  candidates.isNotEmpty() -> "الخلايا موجودة لكن لم نجد إحداثيات موثقة لها"
                                  else -> "الراوتر لم يعرض Cell ID + TAC/LAC كافيين لتحديد موقع البرج"
                              },
                              color = TowerMapMuted,
                              fontSize = 10.sp
                          )
                      }
                      Text(
                          "تغطية CST",
                          color = TowerMapBlue,
                          fontSize = 11.sp,
                          fontWeight = FontWeight.Bold,
                          modifier = Modifier.clickable { openCstCoverage(context) }.padding(8.dp)
                      )
                  }

                  Spacer(Modifier.height(10.dp))

                  if (!locationAllowed) {
                      Row(
                          Modifier.fillMaxWidth().clip(RoundedCornerShape(14.dp)).background(Color.White)
                              .clickable {
                                  permissionLauncher.launch(
                                      arrayOf(
                                          Manifest.permission.ACCESS_FINE_LOCATION,
                                          Manifest.permission.ACCESS_COARSE_LOCATION
                                      )
                                  )
                              }
                              .padding(12.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Column(Modifier.weight(1f)) {
                              Text("إظهار موقعك على الخريطة", color = TowerMapInk, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                              Text("يستخدم GPS/الموقع من الهاتف فقط", color = TowerMapMuted, fontSize = 10.sp)
                          }
                          Text("تفعيل", color = TowerMapBlue, fontSize = 12.sp, fontWeight = FontWeight.Black)
                      }
                      Spacer(Modifier.height(8.dp))
                  }

                  TowerWebMap(
                      userLocation = deviceLocation,
                      markers = located,
                      modifier = Modifier.fillMaxWidth().height(235.dp).clip(RoundedCornerShape(16.dp))
                  )

                  Spacer(Modifier.height(10.dp))
                  val current = located.firstOrNull { it.candidate.current }
                  if (current != null) {
                      TowerMarkerRow(current, deviceLocation, busy, onLockCell)
                  } else {
                      Row(
                          Modifier.fillMaxWidth().clip(RoundedCornerShape(14.dp)).background(Color.White).padding(12.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Column(Modifier.weight(1f)) {
                              Text("البرج الحالي", color = TowerMapInk, fontSize = 12.sp, fontWeight = FontWeight.Black)
                              Text(
                                  currentRadioSummary(snapshot),
                                  color = TowerMapMuted,
                                  fontSize = 10.sp
                              )
                          }
                          Text("الموقع غير متوفر", color = TowerMapMuted, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                      }
                  }

                  located.filterNot { it.candidate.current }.take(6).forEach { marker ->
                      Spacer(Modifier.height(7.dp))
                      TowerMarkerRow(marker, deviceLocation, busy, onLockCell)
                  }

                  Spacer(Modifier.height(8.dp))
                  Text(
                      "الدبابيس لا تُنشأ من PCI أو قوة الإشارة وحدهما. يلزم Cell ID وTAC/LAC ثم تطابق فعلي مع قاعدة مواقع. التردد الظاهر هو تردد مرصود، وليس ادعاءً بكل الترددات التي يدعمها الموقع.",
                      color = TowerMapMuted,
                      fontSize = 9.sp,
                      lineHeight = 13.sp
