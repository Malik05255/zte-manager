name: Tower Map Compatibility Fix

on:
  push:
    branches:
      - feature/connect-performance-credentials-0.5.7

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/connect-performance-credentials-0.5.7
          fetch-depth: 0

      - name: Preserve NearbyCell positional API and push
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/malik/ztesmartmanager/core/tower/TowerLockEngine.kt')
          text = p.read_text(encoding='utf-8')
          old = '''    val sinr: Double?,
    val cellId: Long? = null,
    val areaCode: Int? = null,
    val samplesSeen: Int = 1,
    val samplesTotal: Int = 1,
    val presencePercent: Int = 100,
    val stabilityScore: Int? = null,
    val evidenceScore: Int? = null,
    val confidence: CellConfidence? = null
'''
          new = '''    val sinr: Double?,
    val samplesSeen: Int = 1,
    val samplesTotal: Int = 1,
    val presencePercent: Int = 100,
    val stabilityScore: Int? = null,
    val evidenceScore: Int? = null,
    val confidence: CellConfidence? = null,
    val cellId: Long? = null,
    val areaCode: Int? = null
'''
          if old in text:
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('NearbyCell block not found')
          PY
          git config user.name "Malik05255"
          git config user.email "mmbbrr99@gmail.com"
          git add app/src/main/java/com/malik/ztesmartmanager/core/tower/TowerLockEngine.kt
          if ! git diff --cached --quiet; then
            git commit -m "Preserve NearbyCell positional compatibility"
            git push origin HEAD:feature/connect-performance-credentials-0.5.7
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Run truth-first unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zte-smart-manager-debug
          path: app/build/outputs/apk/debug/app-debug.apk
