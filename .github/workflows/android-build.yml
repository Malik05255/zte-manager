name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Run truth-first unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build verification APK for pull requests
        if: github.ref != 'refs/heads/main'
        run: gradle :app:assembleDebug --stacktrace

      - name: Require stable signing key on main
        if: github.ref == 'refs/heads/main'
        env:
          ZTE_KEYSTORE_BASE64: ${{ secrets.ZTE_KEYSTORE_BASE64 }}
          ZTE_KEYSTORE_PASSWORD: ${{ secrets.ZTE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ZTE_KEYSTORE_BASE64" ] || [ -z "$ZTE_KEYSTORE_PASSWORD" ]; then
            echo "Stable signing secrets are missing. Refusing to create an installable production APK with a temporary debug key."
            exit 1
          fi

      - name: Prepare stable release keystore
        if: github.ref == 'refs/heads/main'
        env:
          ZTE_KEYSTORE_BASE64: ${{ secrets.ZTE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ZTE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zte-smart-hai-release.jks"
          chmod 600 "$RUNNER_TEMP/zte-smart-hai-release.jks"

      - name: Build signed production APK
        if: github.ref == 'refs/heads/main'
        env:
          ZTE_SIGNING_STORE_FILE: ${{ runner.temp }}/zte-smart-hai-release.jks
          ZTE_SIGNING_STORE_PASSWORD: ${{ secrets.ZTE_KEYSTORE_PASSWORD }}
          ZTE_SIGNING_KEY_ALIAS: zte-smart-hai
          ZTE_SIGNING_KEY_PASSWORD: ${{ secrets.ZTE_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify production APK signature and package
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          EXPECTED_CERT="69FF3E0474964C733322E2AF1F36D840C03E22284B27731FF6B0D4B607D83009"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apk-signature.txt
          ACTUAL_CERT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/apk-signature.txt | head -n1 | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')
          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "Signing certificate mismatch. Expected $EXPECTED_CERT but got $ACTUAL_CERT"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.malik.ztesmartmanager'" /tmp/apk-badging.txt

      - name: Upload signed production APK
        if: github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@v4
        with:
          name: zte-smart-hai-signed-release
          path: app/build/outputs/apk/release/app-release.apk
