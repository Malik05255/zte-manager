name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Prepare monotonically increasing app version
        shell: bash
        run: |
          echo "ZTE_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "ZTE_VERSION_NAME=0.5.8.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Require stable update signing identity
        env:
          ZTE_KEYSTORE_BASE64: ${{ secrets.ZTE_KEYSTORE_BASE64 }}
          ZTE_KEYSTORE_PASSWORD: ${{ secrets.ZTE_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$ZTE_KEYSTORE_BASE64" ] || [ -z "$ZTE_KEYSTORE_PASSWORD" ]; then
            echo "Stable signing secrets are missing. Refusing to publish another APK with a changing debug signature."
            exit 1
          fi

      - name: Prepare stable signing keystore
        env:
          ZTE_KEYSTORE_BASE64: ${{ secrets.ZTE_KEYSTORE_BASE64 }}
          ZTE_KEYSTORE_PASSWORD: ${{ secrets.ZTE_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          printf '%s' "$ZTE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zte-smart-hai-update.jks"
          chmod 600 "$RUNNER_TEMP/zte-smart-hai-update.jks"
          echo "ZTE_SIGNING_STORE_FILE=$RUNNER_TEMP/zte-smart-hai-update.jks" >> "$GITHUB_ENV"
          echo "ZTE_SIGNING_STORE_PASSWORD=$ZTE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ZTE_SIGNING_KEY_ALIAS=zte-smart-hai" >> "$GITHUB_ENV"
          echo "ZTE_SIGNING_KEY_PASSWORD=$ZTE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Run truth-first unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build signed update APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify signed update APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          EXPECTED_CERT="69FF3E0474964C733322E2AF1F36D840C03E22284B27731FF6B0D4B607D83009"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apk-signature.txt
          ACTUAL_CERT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/apk-signature.txt | head -n1 | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')
          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "Signing certificate mismatch"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.malik.ztesmartmanager'" /tmp/apk-badging.txt
          grep -q "versionName='${ZTE_VERSION_NAME}'" /tmp/apk-badging.txt

      - name: Upload Honor 200 update APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zte-smart-hai-honor200-update
          path: app/build/outputs/apk/release/app-release.apk
