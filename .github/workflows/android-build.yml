          private val TowerMapInk = Color(0xFF10275C)
          private val TowerMapMuted = Color(0xFF6A7690)
          private val TowerMapBlue = Color(0xFF1464F4)
          private val TowerMapGreen = Color(0xFF18B978)
          private val TowerMapSoft = Color(0xFFF5F8FC)
          private val TowerMapSoftGreen = Color(0xFFEAF8F3)

          private data class TowerLookupCandidate(
              val rat: String,
              val band: String?,
              val pci: Int?,
              val arfcn: Int?,
              val mcc: Int,
              val mnc: Int,
              val areaCode: Int,
