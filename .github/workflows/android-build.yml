name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Prepare monotonically increasing app version
        shell: bash
        run: |
          echo "ZTE_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "ZTE_VERSION_NAME=0.5.8.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Run truth-first unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build unsigned test release
        if: github.event_name == 'pull_request'
        run: gradle :app:assembleRelease --stacktrace

      - name: Sign PR APK with stable public Android test identity
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/aosp-testkey"
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/aosp-mirror/platform_build/main/target/product/security/testkey.pk8 \
            --output "$RUNNER_TEMP/aosp-testkey/testkey.pk8"
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/aosp-mirror/platform_build/main/target/product/security/testkey.x509.pem \
            --output "$RUNNER_TEMP/aosp-testkey/testkey.x509.pem"
          CERT_SHA=$(openssl x509 -in "$RUNNER_TEMP/aosp-testkey/testkey.x509.pem" -outform DER | sha256sum | awk '{print toupper($1)}')
          test "$CERT_SHA" = "A40DA80A59D170CAA950CF15C18C454D47A39B26989D8B640ECD745BA71BF5DC"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          OUT="app/build/outputs/apk/release/ztesmart-honor200-test.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --key "$RUNNER_TEMP/aosp-testkey/testkey.pk8" \
            --cert "$RUNNER_TEMP/aosp-testkey/testkey.x509.pem" \
            --out "$OUT" "$UNSIGNED"

      - name: Prepare private production signing on main
        if: github.event_name != 'pull_request'
        env:
          ZTE_KEYSTORE_BASE64: ${{ secrets.ZTE_KEYSTORE_BASE64 }}
          ZTE_KEYSTORE_PASSWORD: ${{ secrets.ZTE_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$ZTE_KEYSTORE_BASE64" ] || [ -z "$ZTE_KEYSTORE_PASSWORD" ]; then
            echo "Production signing secrets are required on main."
            exit 1
          fi
          printf '%s' "$ZTE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zte-smart-hai-release.jks"
          chmod 600 "$RUNNER_TEMP/zte-smart-hai-release.jks"
          echo "ZTE_SIGNING_STORE_FILE=$RUNNER_TEMP/zte-smart-hai-release.jks" >> "$GITHUB_ENV"
          echo "ZTE_SIGNING_STORE_PASSWORD=$ZTE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ZTE_SIGNING_KEY_ALIAS=zte-smart-hai" >> "$GITHUB_ENV"
          echo "ZTE_SIGNING_KEY_PASSWORD=$ZTE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build privately signed production APK
        if: github.event_name != 'pull_request'
        run: gradle :app:assembleRelease --stacktrace

      - name: Normalize production artifact name
        if: github.event_name != 'pull_request'
        shell: bash
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/ztesmart-honor200-test.apk

      - name: Verify APK identity
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/ztesmart-honor200-test.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/ztesmart-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/ztesmart-badging.txt
          grep -q "package: name='com.malik.ztesmartmanager'" /tmp/ztesmart-badging.txt
          grep -q "versionName='${ZTE_VERSION_NAME}'" /tmp/ztesmart-badging.txt
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ACTUAL_CERT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/ztesmart-signature.txt | head -n1 | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')
            test "$ACTUAL_CERT" = "A40DA80A59D170CAA950CF15C18C454D47A39B26989D8B640ECD745BA71BF5DC"
          fi

      - name: Upload Honor 200 update APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zte-smart-hai-honor200-update
          path: app/build/outputs/apk/release/ztesmart-honor200-test.apk
