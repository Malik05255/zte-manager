          @SuppressLint("SetJavaScriptEnabled")
          @Composable
          private fun TowerWebMap(
              userLocation: Location?,
              markers: List<TowerLocatedMarker>,
              modifier: Modifier = Modifier
          ) {
              val html = remember(userLocation?.latitude, userLocation?.longitude, markers) {
                  buildMapHtml(userLocation, markers)
              }
              AndroidView(
                  modifier = modifier,
                  factory = { context ->
                      WebView(context).apply {
                          settings.javaScriptEnabled = true
                          settings.domStorageEnabled = true
                          webViewClient = WebViewClient()
                          setBackgroundColor(android.graphics.Color.TRANSPARENT)
                      }
                  },
                  update = { webView ->
                      val hash = html.hashCode()
                      if (webView.tag != hash) {
                          webView.tag = hash
                          webView.loadDataWithBaseURL(
                              "https://www.openstreetmap.org/",
                              html,
                              "text/html",
                              "UTF-8",
                              null
                          )
                      }
                  }
              )
          }

          private fun buildMapHtml(userLocation: Location?, markers: List<TowerLocatedMarker>): String {
              val first = markers.firstOrNull()?.point
              val centerLat = userLocation?.latitude ?: first?.latitude ?: 23.8859
              val centerLon = userLocation?.longitude ?: first?.longitude ?: 45.0792
              val userJs = userLocation?.let {
                  "L.circleMarker([${it.latitude},${it.longitude}],{radius:8,color:'#1464F4',weight:3,fillColor:'#1464F4',fillOpacity:0.95}).addTo(map).bindPopup('موقعك الحالي'); bounds.push([${it.latitude},${it.longitude}]);"
              }.orEmpty()
              val markersJs = markers.joinToString("\n") { marker ->
                  val c = marker.candidate
                  val label = jsEscape(
                      (if (c.current) "البرج الحالي" else "خلية مرصودة") +
                          " • " + (c.band ?: c.rat) +
                          (c.pci?.let { " • PCI $it" } ?: "") +
                          (c.arfcn?.let { " • ARFCN $it" } ?: "")
                  )
                  val color = if (c.current) "#18B978" else "#F59E0B"
                  "L.circleMarker([${marker.point.latitude},${marker.point.longitude}],{radius:${if (c.current) 10 else 8},color:'$color',weight:3,fillColor:'$color',fillOpacity:0.9}).addTo(map).bindPopup('$label'); bounds.push([${marker.point.latitude},${marker.point.longitude}]);"
              }

              return """
                  <!doctype html>
                  <html dir="rtl">
                  <head>
                    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
                    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
                    <style>
                      html,body,#map{height:100%;width:100%;margin:0;background:#eef2f7;font-family:Arial,sans-serif}
                      .leaflet-control-attribution{font-size:8px}
                    </style>
                  </head>
                  <body>
                    <div id="map"></div>
                    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
                    <script>
                      const map=L.map('map',{zoomControl:true,attributionControl:true}).setView([$centerLat,$centerLon],14);
                      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
                      const bounds=[];
                      $userJs
                      $markersJs
                      if(bounds.length>1){map.fitBounds(bounds,{padding:[35,35],maxZoom:16});}
                      else if(bounds.length===1){map.setView(bounds[0],15);}
                    </script>
                  </body>
                  </html>
              """.trimIndent()
          }

          private fun buildTowerCandidates(snapshot: RouterSnapshot, cells: List<NearbyCell>): List<TowerLookupCandidate> {
              val raw = snapshot.raw
              val mcc = firstInt(raw, "rmcc", "mdm_mcc") ?: return emptyList()
              val mnc = firstInt(raw, "rmnc", "mdm_mnc") ?: return emptyList()
              val result = mutableListOf<TowerLookupCandidate>()

              currentCandidate(snapshot, mcc, mnc)?.let(result::add)

              cells.forEach { cell ->
                  val area = cell.areaCode ?: return@forEach
                  val cellId = cell.cellId ?: return@forEach
                  val isCurrent = isCurrentCell(snapshot, cell)
                  result += TowerLookupCandidate(
                      rat = cell.rat,
                      band = cell.band,
                      pci = cell.pci,
                      arfcn = cell.arfcn,
                      mcc = mcc,
                      mnc = mnc,
                      areaCode = area,
                      cellId = cellId,
                      current = isCurrent,
                      original = cell
                  )
              }

              return result
                  .distinctBy { TowerLookupKey(it.mcc, it.mnc, it.areaCode, it.cellId) }
                  .sortedByDescending { it.current }
          }

          private fun currentCandidate(snapshot: RouterSnapshot, mcc: Int, mnc: Int): TowerLookupCandidate? {
              val raw = snapshot.raw
              val nrActive = raw["_zte_nr_active_verified"].equals("true", true)
              val area = if (nrActive) {
                  firstAreaCode(raw, "nr5g_tac", "tac", "tac_code", "lte_tac", "lte_lac", "lac", "lac_code")
              } else {
                  firstAreaCode(raw, "lte_tac", "lte_lac", "tac", "tac_code", "lac", "lac_code")
              } ?: return null

              return if (nrActive) {
                  val cellId = raw["_zte_nr_cell_id_decoded"]?.toLongOrNull()
                      ?: return null
                  val pci = raw["_zte_nr_pci_decoded"]?.toIntOrNull()
                  val arfcn = firstInt(raw, "nr_ca_pcell_freq", "nr5g_action_channel", "Z5g_dlEarfcn")
                  TowerLookupCandidate(
                      rat = "NR",
                      band = snapshot.nrBand,
                      pci = pci,
                      arfcn = arfcn,
                      mcc = mcc,
                      mnc = mnc,
                      areaCode = area,
                      cellId = cellId,
                      current = true,
                      original = null
                  )
              } else {
                  val cellId = snapshot.cellId ?: return null
                  TowerLookupCandidate(
                      rat = "LTE",
                      band = snapshot.lteBand,
                      pci = snapshot.pci,
                      arfcn = snapshot.earfcn,
                      mcc = mcc,
                      mnc = mnc,
                      areaCode = area,
                      cellId = cellId,
                      current = true,
                      original = null
                  )
              }
          }

          private fun isCurrentCell(snapshot: RouterSnapshot, cell: NearbyCell): Boolean {
              if (cell.rat.equals("LTE", true)) {
                  return cell.pci != null && cell.arfcn != null &&
                      cell.pci == snapshot.pci && cell.arfcn == snapshot.earfcn
              }
              val raw = snapshot.raw
              val nrPci = raw["_zte_nr_pci_decoded"]?.toIntOrNull()
              val nrArfcn = firstInt(raw, "nr_ca_pcell_freq", "nr5g_action_channel", "Z5g_dlEarfcn")
              return cell.pci != null && cell.arfcn != null && cell.pci == nrPci && cell.arfcn == nrArfcn
          }

          private object OpenTowerGeoResolver {
              private val hitCache = linkedMapOf<TowerLookupKey, TowerGeoPoint>()
              private val missCache = linkedSetOf<TowerLookupKey>()

              fun locate(candidate: TowerLookupCandidate): TowerGeoPoint? {
                  val key = TowerLookupKey(candidate.mcc, candidate.mnc, candidate.areaCode, candidate.cellId)
                  synchronized(this) {
                      hitCache[key]?.let { return it }
                      if (key in missCache) return null
                  }

                  val result = runCatching { fetch(key) }.getOrNull()
                  synchronized(this) {
                      if (result == null) missCache += key else hitCache[key] = result
                  }
                  return result
              }

              private fun fetch(key: TowerLookupKey): TowerGeoPoint? {
                  val url = URL(
                      "https://api.mylnikov.org/geolocation/cell?v=1.1&data=open" +
                          "&mcc=${key.mcc}&mnc=${key.mnc}&lac=${key.areaCode}&cellid=${key.cellId}"
                  )
                  val connection = (url.openConnection() as HttpURLConnection).apply {
                      requestMethod = "GET"
                      connectTimeout = 4_000
                      readTimeout = 5_000
                      useCaches = true
                      setRequestProperty("Accept", "application/json")
                      setRequestProperty("User-Agent", "ZTE-Smart-HAI/${BuildConfig.VERSION_NAME}")
                  }
                  val code = connection.responseCode
                  if (code !in 200..299) return null
                  val text = connection.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                  val json = JSONObject(text)
                  if (json.optInt("result") != 200) return null
                  val data = json.optJSONObject("data") ?: return null
                  val lat = data.optString("lat").toDoubleOrNull() ?: return null
                  val lon = data.optString("lon").toDoubleOrNull() ?: return null
                  if (lat !in -90.0..90.0 || lon !in -180.0..180.0) return null
                  val accuracy = data.optString("range").toDoubleOrNull()?.takeIf { it >= 0.0 }
                  return TowerGeoPoint(lat, lon, accuracy)
              }
          }

          private fun firstInt(raw: Map<String, String>, vararg names: String): Int? = names.asSequence()
              .mapNotNull { raw[it]?.trim()?.toIntOrNull() }
              .firstOrNull()

          private fun firstAreaCode(raw: Map<String, String>, vararg names: String): Int? = names.asSequence()
              .mapNotNull { parseAreaCode(raw[it]) }
              .firstOrNull()

          private fun parseAreaCode(value: String?): Int? {
              val text = value?.trim()?.takeIf { it.isNotEmpty() } ?: return null
              val explicitHex = text.startsWith("0x", true) || text.any { it.lowercaseChar() in 'a'..'f' }
              val token = text.removePrefix("0x").removePrefix("0X")
              val parsed = if (explicitHex) token.toIntOrNull(16) else token.toIntOrNull(10)
              return parsed?.takeIf { it >= 0 }
          }

          private fun currentRadioSummary(snapshot: RouterSnapshot): String {
              val nr = snapshot.raw["_zte_nr_active_verified"].equals("true", true)
              return if (nr) {
                  listOfNotNull(snapshot.nrBand, snapshot.networkType).joinToString(" • ").ifBlank { "5G مؤكد، لكن هوية الموقع ناقصة" }
              } else {
                  buildString {
                      append(snapshot.lteBand ?: "LTE")
                      snapshot.pci?.let { append(" • PCI $it") }
                      snapshot.earfcn?.let { append(" • EARFCN $it") }
                  }
              }
          }

          private fun openCstCoverage(context: Context) {
              runCatching {
                  context.startActivity(
                      Intent(
                          Intent.ACTION_VIEW,
                          Uri.parse("https://crmindividuals.cst.gov.sa/auth/dashboard/coverage-maps")
                      )
                  )
              }
          }

          private fun hasLocationPermission(context: Context): Boolean =
              ContextCompat.checkSelfPermission(context, Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED ||
                  ContextCompat.checkSelfPermission(context, Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED

          @SuppressLint("MissingPermission")
          private fun bestLastKnownLocation(context: Context): Location? {
              if (!hasLocationPermission(context)) return null
              val manager = context.getSystemService(Context.LOCATION_SERVICE) as LocationManager
              return listOf(
                  LocationManager.GPS_PROVIDER,
                  LocationManager.NETWORK_PROVIDER,
                  LocationManager.PASSIVE_PROVIDER
              ).mapNotNull { provider -> runCatching { manager.getLastKnownLocation(provider) }.getOrNull() }
                  .maxByOrNull { it.time }
          }

          @SuppressLint("MissingPermission")
          private fun startLocationUpdates(manager: LocationManager, listener: LocationListener) {
              listOf(LocationManager.GPS_PROVIDER, LocationManager.NETWORK_PROVIDER).forEach { provider ->
                  if (runCatching { manager.isProviderEnabled(provider) }.getOrDefault(false)) {
                      runCatching { manager.requestLocationUpdates(provider, 4_000L, 3f, listener) }
                  }
              }
          }

          private fun distanceMeters(lat1: Double, lon1: Double, lat2: Double, lon2: Double): Double {
              val earth = 6_371_000.0
              val p1 = Math.toRadians(lat1)
              val p2 = Math.toRadians(lat2)
              val dp = Math.toRadians(lat2 - lat1)
              val dl = Math.toRadians(lon2 - lon1)
              val a = sin(dp / 2) * sin(dp / 2) + cos(p1) * cos(p2) * sin(dl / 2) * sin(dl / 2)
              return earth * 2 * atan2(sqrt(a), sqrt(1 - a))
          }

