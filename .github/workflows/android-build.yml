name: Tower Map Source Fix

on:
  push:
    branches:
      - feature/connect-performance-credentials-0.5.7

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/connect-performance-credentials-0.5.7
          fetch-depth: 0

      - name: Fix generated source and restore workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/malik/ztesmartmanager/TowerMapPanel.kt')
          text = p.read_text(encoding='utf-8')
          if text.startswith('\\\n'):
              p.write_text(text[2:], encoding='utf-8')
          workflow = '''name: Android Build

          on:
            push:
              branches: [ "main" ]
            pull_request:
              branches: [ "main" ]
            workflow_dispatch:

          jobs:
            build:
              runs-on: ubuntu-latest
              timeout-minutes: 20

              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Set up JDK 17
                  uses: actions/setup-java@v5
                  with:
                    distribution: temurin
                    java-version: "17"

                - name: Set up Android SDK 36
                  uses: android-actions/setup-android@v3
                  with:
                    packages: "platform-tools platforms;android-36 build-tools;36.0.0"

                - name: Set up Gradle 9.6
                  uses: gradle/actions/setup-gradle@v4
                  with:
                    gradle-version: "9.6.0"

                - name: Run truth-first unit tests
                  run: gradle :app:testDebugUnitTest --stacktrace

                - name: Run Android lint
                  run: gradle :app:lintDebug --stacktrace

                - name: Build debug APK
                  run: gradle :app:assembleDebug --stacktrace

                - name: Upload debug APK
                  if: success()
                  uses: actions/upload-artifact@v4
                  with:
                    name: zte-smart-manager-debug
                    path: app/build/outputs/apk/debug/app-debug.apk
          '''
          from textwrap import dedent
          Path('.github/workflows/android-build.yml').write_text(dedent(workflow), encoding='utf-8')
          PY
          git config user.name "Malik05255"
          git config user.email "mmbbrr99@gmail.com"
          git add app/src/main/java/com/malik/ztesmartmanager/TowerMapPanel.kt .github/workflows/android-build.yml
          git commit -m "Fix tower map source and restore Android CI"
          git push origin HEAD:feature/connect-performance-credentials-0.5.7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Run truth-first unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zte-smart-manager-debug
          path: app/build/outputs/apk/debug/app-debug.apk
