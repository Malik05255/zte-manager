          @Composable
          private fun TowerMarkerRow(
              marker: TowerLocatedMarker,
              userLocation: Location?,
              busy: Boolean,
              onLockCell: (NearbyCell) -> Unit
          ) {
              val candidate = marker.candidate
              val distance = userLocation?.let {
                  distanceMeters(it.latitude, it.longitude, marker.point.latitude, marker.point.longitude)
              }
              val canLock = !candidate.current && candidate.rat.equals("LTE", true) &&
                  candidate.original?.pci != null && candidate.original.arfcn != null

              Row(
                  Modifier.fillMaxWidth().clip(RoundedCornerShape(14.dp))
                      .background(if (candidate.current) TowerMapSoftGreen else Color.White)
                      .padding(12.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Column(Modifier.weight(1f)) {
                      Text(
                          if (candidate.current) "● البرج/الخلية الحالية" else "برج/خلية مرصودة",
                          color = if (candidate.current) TowerMapGreen else TowerMapInk,
                          fontSize = 12.sp,
                          fontWeight = FontWeight.Black
                      )
                      Text(
                          buildString {
                              append(candidate.band ?: candidate.rat)
                              candidate.pci?.let { append(" • PCI $it") }
                              candidate.arfcn?.let { append(" • ARFCN $it") }
                          },
                          color = TowerMapInk,
                          fontSize = 10.sp,
                          fontWeight = FontWeight.Bold
                      )
                      Text(
                          buildString {
                              if (distance != null) append("يبعد تقريبًا ${formatDistance(distance)}")
                              marker.point.accuracyMeters?.let {
                                  if (isNotEmpty()) append(" • ")
                                  append("دقة المصدر ±${it.roundToInt()}م")
                              }
                          }.ifBlank { "إحداثيات متاحة من قاعدة المواقع" },
                          color = TowerMapMuted,
                          fontSize = 9.sp
                      )
                  }
                  when {
                      candidate.current -> Text("متصل", color = TowerMapGreen, fontSize = 11.sp, fontWeight = FontWeight.Black)
                      canLock -> Text(
                          if (busy) "…" else "انتقل",
                          color = if (busy) TowerMapMuted else TowerMapBlue,
                          fontSize = 11.sp,
                          fontWeight = FontWeight.Black,
                          modifier = Modifier.clickable(enabled = !busy) {
                              candidate.original?.let(onLockCell)
                          }.padding(8.dp)
                      )
                      else -> Text("عرض فقط", color = TowerMapMuted, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                  }
