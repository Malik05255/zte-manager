name: One-shot UI scale polish

on:
  push:
    branches:
      - feature/connect-performance-credentials-0.5.7
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/connect-performance-credentials-0.5.7
          fetch-depth: 0
      - name: Apply project-wide readable sizing and safe scrolling
        run: |
          echo '' | base64 -d > /tmp/ui_patch.py
          python3 /tmp/ui_patch.py
      - name: Commit project-wide UI polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-ui-scale-polish.yml
          git add app/src/main/java app/src/test/java
          git commit -m "Redesign all screens for readable scale and safe scrolling"
          git push origin HEAD:feature/connect-performance-credentials-0.5.7
